services:
  api:
    build:
      dockerfile: Dockerfile.dev
      context: .
    environment:
      - NODE_ENV=development
      - PORT=8080
    volumes:
      - .:/usr/src/app
      - ./node_modules:/usr/src/app/node_modules
    command: npm run start:dev
    ports:
      - 8080:8080
      - 9229:9229
    develop:
      watch:
        - action: sync
          path: ./src
          target: /usr/src/app
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json
    depends_on:
      - db
  db:
    image: postgis/postgis:15-3.3
    restart: always
    environment:
      - POSTGRES_DB=quizzem
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
    ports:
      - '5432:5432'
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
volumes:
  node_modules:
